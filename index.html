<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Grader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Room Grader</h1>
      <p>Take or upload a room photo and get a cleanliness score (0-100).</p>
      <label class="file-input">
        <span>Choose Photo</span>
        <input id="photoInput" type="file" accept="image/*" capture="environment" />
      </label>
      <canvas id="previewCanvas" hidden></canvas>
      <button id="scoreButton" type="button" disabled>Score Room</button>
      <section id="result" hidden>
        <h2>Score: <span id="scoreValue"></span>/100</h2>
        <p id="scoreSummary"></p>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
